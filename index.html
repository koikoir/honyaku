<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日・シンハラ語 通訳アプリ</title>
    
    <!-- PWA・アプリ化設定 -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="通訳アプリ">
    <link rel="manifest" href="data:application/manifest+json;utf8,{%22name%22:%22介護・生活通訳アプリ%22,%22short_name%22:%22通訳アプリ%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%234f46e5%22,%22theme_color%22:%22%234f46e5%22}">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* アプリ風UI・タッチ操作最適化 */
        body { -webkit-tap-highlight-color: transparent; }
        .chat-container { height: calc(100vh - 340px); }
        .rotate-180-deg { transform: rotate(180deg); }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 flex flex-col h-screen max-w-md mx-auto shadow-2xl select-none pt-safe">

    <!-- アプリ風ヘッダー -->
    <header class="bg-indigo-600 text-white px-4 py-3 flex justify-between items-center shadow-md pt-6">
        <div>
            <h1 class="font-bold text-base flex items-center gap-2">
                <i class="fa-solid fa-hands-holding-child"></i> 介護・生活 通訳
            </h1>
            <p class="text-[10px] text-indigo-200">日本語 ⇄ シンハラ語 リアルタイムサポート</p>
        </div>
        <button id="toggleInvertBtn" class="bg-indigo-500 hover:bg-indigo-700 active:bg-indigo-800 text-xs px-3 py-1.5 rounded-full flex items-center gap-1.5 transition font-medium shadow">
            <i class="fa-solid fa-arrows-rotate"></i> 対面表示
        </button>
    </header>

    <!-- チャット表示エリア -->
    <main id="chatArea" class="chat-container overflow-y-auto p-4 space-y-3 flex-1 bg-slate-50 transition-transform duration-300">
        <div class="text-center text-xs text-slate-400 my-1">--- 通訳会話ログ ---</div>
        
        <div class="flex flex-col items-end">
            <div class="flex items-center gap-1">
                <div class="max-w-[85%] p-3 rounded-2xl shadow-sm text-sm bg-indigo-600 text-white rounded-br-none">
                    おはようございます！体調はいかがですか？
                </div>
                <button onclick="speakText('おはようございます！体調はいかがですか？', 'ja')" class="text-xs text-slate-400 hover:text-indigo-600 ml-1">
                    <i class="fa-solid fa-volume-high"></i>
                </button>
            </div>
        </div>

        <div class="flex flex-col items-start">
            <div class="flex items-center gap-1">
                <div class="max-w-[85%] p-3 rounded-2xl shadow-sm text-sm bg-white text-slate-800 rounded-bl-none border border-slate-200">
                    සුබ උදෑසනක්! මට සනීපයි. (おはようございます！元気です)
                </div>
                <button onclick="speakText('සුබ උදෑසනක්! මට සනීපයි.', 'si')" class="text-xs text-slate-400 hover:text-indigo-600 ml-1">
                    <i class="fa-solid fa-volume-high"></i>
                </button>
            </div>
        </div>
    </main>

    <!-- 場面別定型句エリア -->
    <div class="bg-slate-200 border-t border-slate-300">
        <!-- カテゴリ切り替えタブ -->
        <div class="flex bg-slate-300 text-xs font-bold border-b border-slate-300">
            <button onclick="switchCategory('care')" id="tab-care" class="flex-1 py-2.5 text-center bg-white text-indigo-600 border-b-2 border-indigo-600">介護現場</button>
            <button onclick="switchCategory('daily')" id="tab-daily" class="flex-1 py-2.5 text-center text-slate-600 hover:text-indigo-600">日常・生活</button>
            <button onclick="switchCategory('greeting')" id="tab-greeting" class="flex-1 py-2.5 text-center text-slate-600 hover:text-indigo-600">挨拶・返事</button>
        </div>

        <!-- ボタン一覧 -->
        <div id="phraseList" class="p-2.5 overflow-x-auto whitespace-nowrap space-x-2 text-xs flex items-center">
        </div>
    </div>

    <!-- アプリ操作・入力エリア -->
    <footer class="bg-white p-3 border-t border-slate-200 shadow-inner pb-6">
        <!-- 言語切替インジケーター -->
        <div class="flex justify-between items-center mb-2">
            <button id="langToggleBtn" onclick="switchDirection()" class="w-full bg-indigo-50 hover:bg-indigo-100 py-2 px-3 rounded-lg font-bold text-xs text-indigo-700 flex justify-center items-center gap-3 border border-indigo-200 shadow-sm transition">
                <span id="sourceLangText">日本語</span>
                <i class="fa-solid fa-right-left text-xs text-indigo-500"></i>
                <span id="targetLangText">シンハラ語</span>
            </button>
        </div>

        <!-- テキスト入力欄と送信・音声ボタン -->
        <div class="flex gap-2">
            <textarea id="inputText" rows="2" placeholder="メッセージを入力..." class="flex-1 p-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm resize-none"></textarea>
            
            <div class="flex flex-col gap-1.5">
                <button id="micBtn" onclick="toggleSpeechRecognition()" class="bg-rose-500 active:bg-rose-700 text-white w-10 h-10 rounded-lg flex items-center justify-center shadow transition active:scale-95">
                    <i class="fa-solid fa-microphone text-base"></i>
                </button>
                <button onclick="handleTranslate()" class="bg-indigo-600 active:bg-indigo-800 text-white w-10 h-10 rounded-lg flex items-center justify-center shadow transition active:scale-95">
                    <i class="fa-solid fa-paper-plane text-base"></i>
                </button>
            </div>
        </div>
    </footer>

    <script>
        let currentSourceLang = 'ja';
        let currentTargetLang = 'si';
        let isRecognizing = false;
        let recognition = null;

        const phrases = {
            care: [
                { ja: '水分を取ってください', si: 'වතුර බොන්න', lang: 'ja' },
                { ja: '体調は大丈夫ですか？', si: 'සනීපෙන් ඉන්නවද?', lang: 'ja' },
                { ja: 'ゆっくり立ち上がってください', si: 'හෙමින් නැගිටින්න', lang: 'ja' },
                { ja: '少し休みましょう', si: 'ටිකක් විවේක ගන්න', lang: 'ja' },
                { ja: '痛むところはありますか？', si: 'රිදෙන තැනක් තියෙනවද?', lang: 'ja' },
                { ja: 'トイレに行きますか？', si: 'වැසිකිළියට යන්න ඕනද?', lang: 'ja' }
            ],
            daily: [
                { ja: 'ご飯を食べましたか？', si: 'කෑම කෑවද?', lang: 'ja' },
                { ja: 'スーパーはどこですか？', si: 'සුපර් මාකට් එක කොහෙද තියෙන්නේ?', lang: 'ja' },
                { ja: 'これを買いたいです', si: 'මට මේක ගන්න ඕන', lang: 'ja' },
                { ja: 'バスは何時に来ますか？', si: 'බස් එක කීයටද එන්නේ?', lang: 'ja' },
                { ja: '助けてください', si: 'මට උදව් කරන්න', lang: 'ja' }
            ],
            greeting: [
                { ja: 'おはようございます', si: 'සුබ උදෑසනක්', lang: 'ja' },
                { ja: 'ありがとうございます', si: 'ස්තූතියි', lang: 'ja' },
                { ja: 'お疲れ様でした', si: 'මහන්සි වුණාට ස්තූතියි', lang: 'ja' },
                { ja: 'はい', si: 'ඔව්', lang: 'ja' },
                { ja: 'いいえ', si: 'නැත', lang: 'ja' },
                { ja: 'わかりました', si: 'තේරුණා', lang: 'ja' }
            ]
        };

        window.onload = () => {
            switchCategory('care');
        };

        function switchCategory(cat) {
            ['care', 'daily', 'greeting'].forEach(c => {
                const tab = document.getElementById(`tab-${c}`);
                if (c === cat) {
                    tab.className = "flex-1 py-2.5 text-center bg-white text-indigo-600 border-b-2 border-indigo-600 font-bold";
                } else {
                    tab.className = "flex-1 py-2.5 text-center text-slate-600 hover:text-indigo-600 font-medium";
                }
            });

            const listContainer = document.getElementById('phraseList');
            listContainer.innerHTML = '';

            phrases[cat].forEach(p => {
                const btn = document.createElement('button');
                btn.className = "bg-white px-3 py-1.5 rounded-full shadow-sm hover:bg-indigo-50 border border-slate-300 text-slate-700 font-medium active:scale-95 transition";
                btn.innerText = `${p.ja} (${p.si})`;
                btn.onclick = () => quickPhrase(p.ja, p.lang);
                listContainer.appendChild(btn);
            });
        }

        function switchDirection() {
            if (currentSourceLang === 'ja') {
                currentSourceLang = 'si';
                currentTargetLang = 'ja';
                document.getElementById('sourceLangText').innerText = 'シンハラ語';
                document.getElementById('targetLangText').innerText = '日本語';
            } else {
                currentSourceLang = 'ja';
                currentTargetLang = 'si';
                document.getElementById('sourceLangText').innerText = '日本語';
                document.getElementById('targetLangText').innerText = 'シンハラ語';
            }
        }

        function quickPhrase(text, lang) {
            if (currentSourceLang !== lang) {
                switchDirection();
            }
            document.getElementById('inputText').value = text;
            handleTranslate();
        }

        async function handleTranslate() {
            const inputField = document.getElementById('inputText');
            const text = inputField.value.trim();
            if (!text) return;

            inputField.value = '';
            appendMessage(text, 'user', currentSourceLang);

            try {
                const langPair = `${currentSourceLang}|${currentTargetLang}`;
                const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${langPair}`);
                const data = await response.json();

                const translatedText = data.responseData.translatedText;

                appendMessage(translatedText, 'bot', currentTargetLang);
                speakText(translatedText, currentTargetLang);

            } catch (error) {
                appendMessage('翻訳処理でエラーが発生しました。通信環境をご確認ください。', 'bot', 'ja');
            }
        }

        function appendMessage(text, sender, lang) {
            const chatArea = document.getElementById('chatArea');
            const msgDiv = document.createElement('div');
            
            const isUser = sender === 'user';
            msgDiv.className = `flex flex-col ${isUser ? 'items-end' : 'items-start'}`;

            const bubble = document.createElement('div');
            bubble.className = `max-w-[85%] p-3 rounded-2xl shadow-sm text-sm ${
                isUser ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-white text-slate-800 rounded-bl-none border border-slate-200'
            }`;
            bubble.innerText = text;

            const speakBtn = document.createElement('button');
            speakBtn.className = 'text-xs mt-1 text-slate-400 hover:text-indigo-600 self-end ml-1';
            speakBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
            speakBtn.onclick = () => speakText(text, lang);
            
            const container = document.createElement('div');
            container.className = 'flex items-center gap-1';
            container.appendChild(bubble);
            container.appendChild(speakBtn);

            msgDiv.appendChild(container);
            chatArea.appendChild(msgDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function speakText(text, lang) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang === 'ja' ? 'ja-JP' : 'si-LK';
            window.speechSynthesis.speak(utterance);
        }

        function toggleSpeechRecognition() {
            const micBtn = document.getElementById('micBtn');

            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('お使いの端末・ブラウザ環境は直接の音声入力に対応していません。キーボードの音声入力をご利用ください。');
                return;
            }

            if (isRecognizing) {
                recognition.stop();
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = currentSourceLang === 'ja' ? 'ja-JP' : 'si-LK';
            recognition.interimResults = false;

            recognition.onstart = () => {
                isRecognizing = true;
                micBtn.classList.add('animate-pulse', 'bg-red-600');
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('inputText').value = transcript;
                handleTranslate();
            };

            recognition.onerror = () => {
                isRecognizing = false;
                micBtn.classList.remove('animate-pulse', 'bg-red-600');
            };

            recognition.onend = () => {
                isRecognizing = false;
                micBtn.classList.remove('animate-pulse', 'bg-red-600');
            };

            recognition.start();
        }

        document.getElementById('toggleInvertBtn').addEventListener('click', () => {
            document.getElementById('chatArea').classList.toggle('rotate-180-deg');
        });
    </script>
</body>
</html>
